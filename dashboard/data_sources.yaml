        licence: "supplied by AG (OGL v3?)"
        date_accessed: "TBC"
        key_field: "Priority Bracket (Very Low / Low / Medium / High) per water body"
        gridding: "Spatial join of water body score to grid."
        scoring: "Prioritisation score based on EDM12 method (Motts) as part of the ED project."
        notes: "Placeholder dummy values used. **NOTE: All WB's score High Priority. Use EDM12 score values to grade?**"

      - name: "GW Abstractions at Risk  [ED]"
        sidebar_slider: "1.3  GW Abstractions at Risk  [ED]"
