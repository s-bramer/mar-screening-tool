  - label: "Feasibility - Hydrogeology"
    description: >
      Assesses the physical suitability of the surface/subsurface for MAR.
      Combines aquifer productivity, deposit thickness, topography,
      depth to water, and surface geology.
    criteria:

      - name: "Aquifer Classification"
        sidebar_slider: "2.1  Aquifer Classification"
        status: active
        source: "BGS Hydrogeology of Scotland/England/Wales 625K"
        licence: "British Geological Survey (OGL v3)"
        date_accessed: "2024"
        key_field: "CHARACTER - aquifer productivity classification"
        gridding: >
          Spatial join (dominant polygon rule - largest fragment wins) of BGS
          hydrogeology polygons to 1 km grid cells in EPSG:27700.
        scoring: |
          Highly productive aquifer          → 10
          Moderately productive aquifer      →  6
          Low productivity aquifer           →  2
          Rocks with essentially no GW       →  0  (hard exclusion applied)
        notes: "Primary Feasibility criterion. Coarse estimate."

      - name: "SDTM Thickness  [infiltration]"
        sidebar_slider: "2.2  SDTM Thickness  [infiltration]"
        status: active
        source: "BGS Superficial Deposits Thickness Model (SDTM) 1 km"
        licence: "British Geological Survey (OGL v3)"
        date_accessed: "2023"
        key_field: "Mean SDTM thickness per 1 km cell [m]"
        gridding: >
          BGS SDTM raster resampled/aggregated to 1 km cell mean thickness.
          Cells with no superficial deposits assigned 0 m.
        scoring: |
          Linear interpolation (piecewise at points below) with optimal thickness ~2 m for infiltration (very thick deposits reduce infiltration rate):
          0 m → 4,  0.5 m → 6,  2 m → 10,  6 m → 9,  15 m → 6,  30 m → 3
        notes: "Disabled automatically for Borehole / ASR method."

      - name: "Topography / Slope  [infiltration]"
        sidebar_slider: "2.3  Topography / Slope  [infiltration]"
        status: placeholder
        source: "EA LiDAR Composite DTM 10 m, full cover (file: ***LIDAR_Composite_10m_DTM_2022***)"
        licence: "Environment Agency (OGL v3)"
        date_accessed: "2022"
        key_field: "Mean slope (degrees) per 1 km cell, derived from 10 m DTM"
        gridding: >
          Slope raster derived from EA LiDAR 10 m DTM using standard gradient
          calculation. Mean slope aggregated per 1 km cell.
          Flat terrain (low slope) preferred for surface infiltration schemes.
        scoring: |
          0–2°  → 10,  2–5° → 8,  5–10° → 5,  10–15° → 2,  >15° → 0
          To be confirmed.
        notes: "Placeholder dummy values used. Disabled for Borehole/ASR."

      - name: "Depth to Water - NO DATA YET (EA GWM's)"
        sidebar_slider: "2.4  Depth to Water"
        status: placeholder
        source: "**EA GW Models** for GWLs for agreed time period/average; GW Flooding datasets"
        licence: "TBC"
        date_accessed: "-"
        key_field: "Mean depth to water table [m bgl] per 1 km cell"
        gridding: >
          Interpolated groundwater level surface (kriging or IDW from observation
          borehole records) subtracted from DEM to give depth to water table.
          Aggregated to 1 km cell mean.
        scoring: |
          Optimum range: 3–15 m (accessible for borehole; unsaturated for infiltration)
          0–3 m → 2,  3–8 m → 7,  8–15 m → 10,  15–25 m → 9,  25–40 m → 5,  >40 m → 2
        notes: "Placeholder dummy values used. <br> **NOTE: Add Aquifer Thickness and Aquifer Properties (using GWMs)**"

      - name: "Surface Geology  [infiltration]"
        sidebar_slider: "2.5  Surface Geology  [infiltration]"
        status: placeholder
        source: "BGS DiGMapGB 625K - Superficial / Bedrock Geology"
        licence: "British Geological Survey (OGL v3)"
        date_accessed: "2024"
        key_field: "Lithology / permeability classification"
        gridding: >
          Dominant lithology polygon per 1 km cell mapped to permeability class.
          Highly permeable superficial deposits (sands, gravels) score highest.
        scoring: "Lithology → permeability class → 0–10. Mapping TBC."
        notes: "Placeholder dummy values used. Disabled for Borehole/ASR."


  - label: "Supply - Water Availability"
    description: >
      Identifies where sufficient water is available to support MAR operations:
      storm water, treated drinking water, river water or treated wastewater.
    criteria:

      - name: "Storm Water at Network Points  [DWMP] - NO DATA YET (Jack/Network Modelling)?"
        sidebar_slider: "3.1  Storm Water at Network Points  [DWMP]"
        status: placeholder
        source: "Client-supplied - Storm / CSO network data"
        licence: "Client data - distribution restricted"
        date_accessed: "-"
        key_field: "Storm water volume available at network points [Ml/d or m³/yr]"
        gridding: >
          Sum of available storm water volumes at network points within 2 km
          of each cell centroid.
        scoring: "Volume → 0–10. Breakpoints TBC."
        notes: "Placeholder dummy values used. Data not yet received."

      - name: "Drinking Water Availability"
        sidebar_slider: "3.2  Drinking Water Availability"
        status: placeholder
        source: |
          Supplied by ST (pre-processed by OH):
          (A) Supply network mains - Resource Mains and Strategic Trunk Mains; pre-filtered to diameter >200 mm.
              Strategic Trunk includes Derwent Valley Aqueduct (DVA, potable) and Elan Valley Aqueduct (EVA, raw water to Trimpley WTW).
          (B) DSR (District Supply Route) point locations.
        licence: "Client data - OFFICIAL SENSITIVE?"
        date_accessed: "2026"
        key_field: |
          (A) Capacity index (m3) = L × π × (D/1000)² / 4 per cell [m³]
              where L = intersected pipe length per cell (m), D = pipe diameter (mm).
              Calculated separately for Resource Mains and Strategic Trunk (pipes >200 mm only).
          (B) Distance from cell centroid to nearest DSR point [m].
        gridding: |
          Component A - Pipe Capacity Index per cell:
          Capacity Index summed separately by type: Resource Mains (potable) and Strategic Trunk.
          Consider:
          Strategic Trunk split: DVA (potable, weight 1.0) and EVA (raw water, weight 0.6; requires treatment).
          Total index = Resource Mains + DVA + 0.6 × EVA. Normalised 0–10.
          Component B - DSR proximity:
          Distance from cell centroid to nearest DSR.
          Normalised 0–10 (closer = higher score).
        scoring: |
          Composite = Component A × Component B (product, not sum).
          Product ensures both pipe capacity AND network access are required for a high score.
          Product rescaled 0–10 across all cells.
        notes: "Placeholder dummy values used. Phase 2: consider pipe age, material, potable vs raw distinction."

      - name: "Treated Waste Water  [WwTW proximity]"
        sidebar_slider: "3.3  Treated Waste Water  (WwTW proximity)"
        status: placeholder
        source: "Client-supplied / EA - WwTW effluent discharge consents; annual effluent flow data provided in spreadsheet including estimation of DWF"
        licence: "OGL v3 / Client data"
        date_accessed: "-"
        key_field: "DISCHRA - Recent Actual Discharge [Ml/d]; WwTW location"
        gridding: >
          Distance from each cell to nearest WwTW point, weighted by
          consented discharge volume (CONSDWFMLD).
        scoring: "Proximity × volume → 0–10. Breakpoints TBC."
        notes: "Placeholder dummy values used. EA discharge consent data available in WRGIS extract."

      - name: "River Water  (untreated)"
        sidebar_slider: "3.4  River Water  (untreated)"
        status: placeholder
        source: "EA WRGIS - CAMS Assessment Points (file: ***Severn Trent WRGISMay26.xlsx***, sheet CAMS_AP_inST)"
        licence: "Environment Agency - 1-year Conditional Licence (see Severn Trent WRGIS May26 Data licence.docx). Also assumes licensee holds licence for QUBE by Wallingford Hydrosolutions."
        date_accessed: "May 2026"
        key_field: "SDFLQ30ups - Recent Actual scenario surplus/deficit at Q30 [Ml/d] per CAMS Assessment Point"
        gridding: >
          Assign Q30 surplus/deficit value to EA_WB_ID (WFD water body or WRGIS ID).
          Spatial join water body polygons to 1 km grid cells.
          Assume 100% of Q30 surplus could potentially be available for MAR when river flows ≤ Q30.
        scoring: |
          Surplus available at Q30 [Ml/d] → 0–10. Breakpoints TBC.
          Negative values (deficit) → 1 (no river water available).
        notes: "Placeholder dummy values used."


constraints:
  # Hard constraints — cells that intersect these layers are scored 0 regardless of MCE weights.
  # Active constraints are toggled on/off via checkboxes in the dashboard sidebar.

  - name: "Non-productive aquifer"
    dashboard_toggle: "Non-productive aquifer"
    status: active
    source: "BGS Hydrogeology of Scotland/England/Wales 625K"
    licence: "British Geological Survey (OGL v3)"
    date_accessed: "2024"
    key_field: "CHARACTER = 'Rocks with essentially no groundwater'"
    notes: >
      Any 1 km grid cell whose dominant hydrogeology polygon is classified as
      non-productive is hard-excluded. Column c_nonprod stored per cell in
      hover_base.csv; toggled live in the dashboard.

  - name: "GWDTE overlap"
    dashboard_toggle: "GWDTE overlap"
    status: active
    source: "EA Groundwater Dependent Terrestrial Ecosystems (GWDTEs)"
    licence: "Environment Agency (OGL v3)"
    date_accessed: "2024"
    key_field: "Polygon presence/absence"
    notes: >
      Any 1 km grid cell that intersects a GWDTE polygon is hard-excluded.
      Column c_gwdte stored per cell in hover_base.csv; toggled live in the dashboard.

  - name: "Land use — surface water"
    dashboard_toggle: "Land use — surface water  [coming soon]"
    status: coming_soon
    source: "TBC — OS OpenMap Local / EA Open Waterbodies (polygon layer)"
    licence: "TBC"
    date_accessed: "-"
    key_field: "Open water / waterbody polygon"
    notes: >
      Cells coinciding with inland surface water bodies (lakes, reservoirs, wide
      river channels) are inappropriate for surface infiltration schemes. Requires
      polygon waterbody dataset (linear OS Open Rivers centrelines are insufficient).
      Not yet implemented — placeholder checkbox shown in dashboard.

  - name: "Surface water flood risk"
    dashboard_toggle: "Surface water flood risk  [coming soon]"
    status: coming_soon
    source: "EA Risk of Flooding from Surface Water (RoFSW)"
    licence: "Environment Agency (OGL v3)"
    date_accessed: "-"
    key_field: "Flood probability class (High / Medium / Low)"
    notes: "Cells in High or Medium surface water flood risk zones may be excluded. Not yet implemented."

  - name: "Contaminated land / landfill"
    dashboard_toggle: "Contaminated land / landfill  [coming soon]"
    status: coming_soon
    source: "TBC — EA Landfill Register / Local Authority Contaminated Land records"
    licence: "TBC"
    date_accessed: "-"
    key_field: "Polygon presence/absence"
    notes: "Contaminated land or landfill sites are hard constraints for any MAR scheme. Not yet implemented."

  - name: "Source Protection Zone SPZ1"
    dashboard_toggle: "Source Protection Zone SPZ1  [coming soon]"
    status: coming_soon
    source: "EA Source Protection Zones (SPZ)"
    licence: "Environment Agency (OGL v3)"
    date_accessed: "-"
    key_field: "Zone designation (SPZ1 / SPZ2 / SPZ3)"
    notes: >
      SPZ1 (inner zone) — strictest protection; typically excludes infiltration MAR
      due to direct recharge risk to abstraction source. SPZ2/3 may allow MAR with
      mitigation. Constraint to apply SPZ1 only. Not yet implemented.


