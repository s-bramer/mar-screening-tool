# MAR-ST Data Sources
# ============================================================
# Edit this file to update the "Data Sources" tab in the dashboard.
# No code changes needed - the tab re-reads this file on server restart.
#
# status options:
#   active      - real data, processing complete, used in scoring
#   placeholder - dummy/spatially coherent values; real data pending
#   coming_soon - layer exists in UI but not yet loaded
#   overlay     - spatial context layer only; not used in MCE scoring
# ============================================================

themes:

  - label: "Demand - Need for MAR"
    description: >
      Identifies where MAR is most needed: stressed groundwater bodies,
      over-abstracted catchments, GWDTE's, DWMP pressure points.
    criteria:

      - name: "GWDTE Proximity  [ED]"
        sidebar_slider: "1.1  GWDTE Proximity  [ED]"
        status: placeholder
        source: "EA - Groundwater Dependent Terrestrial Ecosystems (GWDTEs)"
        licence: "Environment Agency (OGL v3)"
        date_accessed: "TBC"
        key_field: "Presence/absence polygon; proximity calculated at preprocessing"
        gridding: >
          Distance from each cell centre to nearest GWDTE polygon.
          Cells overlapping a GWDTE are hard-excluded from scoring (constraint = 0).
          Nearby cells (< 2 km) scored higher for Environmental Destination objective.
          **Add prioritisation in phase 2**
        scoring: "Proximity distance → 0–10. TBC."
        notes: "Placeholder dummy values used. GWDTEs currently used as hard constraint only."

      - name: "Surface Water Priority  [ED]"
        sidebar_slider: "1.2  Surface Water Body Priority  [ED]"
        status: placeholder
